input {
  file {
    path => "/app/logs/application.log" # This path corresponds to the 'app_logs' volume mount
    start_position => "beginning"
    sincedb_path => "/dev/null" # For simplicity, re-read from beginning on restart (not for production)
    mode => "tail" # Continuously read new lines
  }
}

filter {
  # You can add more sophisticated parsing here if your logs have a specific format.
  # For now, we'll just forward the raw message.
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "carecompass-app-logs-%{+YYYY.MM.dd}" # Daily index for easier management
  }
  stdout { codec => rubydebug } # Helps in debugging Logstash output in its Docker logs
}

